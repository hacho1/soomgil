plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.soomgil'
version = '0.0.1-SNAPSHOT'

// Keep the 10.1 line while including the security fixes released after Boot 3.5.16.
ext['tomcat.version'] = '10.1.60'
ext['jackson-bom.version'] = '2.21.6'
ext['log4j2.version'] = '2.25.5'
ext['mariadb.version'] = '3.5.10'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.jsoup:jsoup:1.23.2'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// The frontend and search backend share one category taxonomy.
tasks.named('processResources') {
	from('../frontend/src/data') {
		include 'categories.json', 'travel-preferences.json', 'regions.json'
		into 'data'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.register('dependencyInventory') {
	doLast {
		def modules = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
			def id = it.moduleVersion.id
			[name: "${id.group}:${id.name}".toString(), version: id.version]
		}.unique().sort { a, b -> a.name <=> b.name }
		def report = layout.buildDirectory.file('reports/dependencies/runtime.json').get().asFile
		report.parentFile.mkdirs()
		report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modules))
		println "Runtime dependency inventory: ${modules.size()} modules"
	}
}
