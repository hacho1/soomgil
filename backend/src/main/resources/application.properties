spring.application.name=soomgil-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.config.import=optional:file:../.env[.properties]
spring.mail.host=${SOOMGIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SOOMGIL_SMTP_PORT:587}
spring.mail.username=${SOOMGIL_SMTP_USERNAME:}
spring.mail.password=${SOOMGIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
soomgil.mail.from=${SOOMGIL_SMTP_FROM:${SOOMGIL_SMTP_USERNAME:}}
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.hikari.connection-timeout=5000
soomgil.backup.enabled=${SOOMGIL_BACKUP_ENABLED:true}
soomgil.backup.directory=${SOOMGIL_BACKUP_DIRECTORY:../backup/database}
soomgil.backup.replica=${SOOMGIL_BACKUP_REPLICA:}
soomgil.backup.keep=${SOOMGIL_BACKUP_KEEP:14}
soomgil.diary.max-entries=${SOOMGIL_DIARY_MAX_ENTRIES:300}
soomgil.diary.max-bytes=${SOOMGIL_DIARY_MAX_BYTES:67108864}

spring.datasource.url=${SOOMGIL_DB_URL:jdbc:h2:file:./data/soomgil;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SOOMGIL_DB_USERNAME:sa}
spring.datasource.password=${SOOMGIL_DB_PASSWORD:}
spring.datasource.driver-class-name=${SOOMGIL_DB_DRIVER:org.h2.Driver}

spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Seoul

spring.session.jdbc.initialize-schema=always
spring.session.jdbc.platform=${SOOMGIL_DB_PLATFORM:h2}
spring.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SOOMGIL_SECURE_COOKIES:false}
server.error.include-message=never
soomgil.admin.username=${SOOMGIL_ADMIN_USERNAME:}
soomgil.google.client-id=${GOOGLE_CLIENT_ID:}
soomgil.naver.client-id=${NAVER_CLIENT_ID:}
soomgil.naver.client-secret=${NAVER_CLIENT_SECRET:}
soomgil.naver.redirect-uri=${NAVER_REDIRECT_URI:}
soomgil.tour-api-key=${SOOMGIL_TOUR_API_KEY:}
soomgil.tour-sync-enabled=${SOOMGIL_TOUR_SYNC_ENABLED:true}
soomgil.tour-catalog-daily-limit=${SOOMGIL_TOUR_CATALOG_DAILY_LIMIT:300}
soomgil.tour-detail-timeout-ms=${SOOMGIL_TOUR_DETAIL_TIMEOUT_MS:3000}
soomgil.tour-detail-daily-limit=${SOOMGIL_TOUR_DETAIL_DAILY_LIMIT:400}
soomgil.demo-users=${SOOMGIL_DEMO_USERS:false}
soomgil.allowed-origins=${SOOMGIL_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
