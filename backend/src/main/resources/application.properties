spring.application.name=soomgil-backend
server.port=${PORT:8080}

spring.datasource.url=${SOOMGIL_DB_URL:jdbc:h2:file:./data/soomgil;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SOOMGIL_DB_USERNAME:sa}
spring.datasource.password=${SOOMGIL_DB_PASSWORD:}
spring.datasource.driver-class-name=${SOOMGIL_DB_DRIVER:org.h2.Driver}

spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Seoul
